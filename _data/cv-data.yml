projects:
  title: Projects
  # intro: >
  #   You can list your side projects in this
  #   section. Feel free to provide a brief introduction.
  assignments:
    - title: Elpi Formalization
      link: https://github.com/dfissore/elpi-formalization
      tagline: |
        A formalization of the Elpi programming language in Rocq.
    - title: tc - A type-class solver for Rocq in Elpi
      link: https://github.com/LPCIC/coq-elpi/tree/master/apps/tc
      tagline: |
        A type-class solver written using the
        [coq-elpi](https://github.com/LPCIC/coq-elpi) framework (the subject of my
        PhD thesis).
    - title: Learning-and-More
      link: https://dfissore.github.io/Learning-And-More?Home
      tagline: |
        A collection of active-learning algorithms, ranging from Angluin's
        **L*** algorithm to **TTT-VPA**.
    - title: All Interval Series
      link: https://github.com/dfissore/All-Intervall-Series
      tagline: |
        A Java solver using
        [Choco-solver](https://github.com/chocoteam/choco-solver), evaluating
        several implementations and using symmetry breaking to improve
        performance.
    - title: Time To Tank
      link: https://www.youtube.com/watch?v=63MywJ9FYEg&t=2s&ab_channel=D.N.AGameProduction
      tagline: |
        A 3D game written in JavaScript using the Babylon.js framework. This game
        was part of a competition in which we won second prize, *TOP du TOP*
        ([here](https://ds4h.univ-cotedazur.fr/retour-sur-la-remise-des-prix-games-on-web-2022)
        is a link to the award ceremony).
    - title: Cryptator
      link: https://github.com/arnaud-m/cryptator
      tagline: |
        A cryptarithm solver based on constraint programming.

