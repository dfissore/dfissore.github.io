career-profile:
  title: Career Profile
  summary: |
    My research interests lie at the intersection of type theory, logic
    programming, and proof assistants. I am particularly interested in strongly
    typed languages and in developing efficient, verified tools for formal
    reasoning.

education:
  title: Education
  info:
    - degree: PhD in Computer Science
      university: Université Côte d'Azur, INRIA
      start-time: 2023
      end-time: 2026
      details: |
        Research in type theory and logic programming, aiming at a
        versatile type-class solver for the Rocq proof assistant and a static
        determinacy checker for Elpi programs.
    - degree: MSc in Computer Science
      university: Université Côte d'Azur
      start-time: 2021
      end-time: 2023
      details: |
        Relevant courses: graph theory, logic, Boolean networks, type theory,
        complexity, constraint programming, linear programming, and artificial
        intelligence.
    - degree: BSc in Computer Science
      university: Université Côte d'Azur
      start-time: 2018
      end-time: 2021
      details: |
        The curriculum covered Java, Python, C, OCaml, Lisp, JavaScript, MySQL,
        data structures, networking, and telecommunications.

experiences:
  title: Experiences
  info:
    - role: Internship in type theory
      time: March 2023 $\rightarrow$ August 2023
      company: INRIA, Sophia Antipolis
      details: |
        Developed a new type-class solver for the Rocq proof assistant using Elpi,
        a logic programming language derived from Prolog with support for binders
        and constraints. Integrated the solver with Rocq-Elpi to provide a readable,
        customizable, and user-friendly implementation.
    - role: Internship in language theory
      time: June 2022 $\rightarrow$ August 2022
      company: I3S, Sophia Antipolis
      details: |
        Studied active automata learning, an approach in which a learner
        reconstructs an unknown regular language by querying a teacher through
        membership and equivalence queries. Applied this framework to visibly
        pushdown grammars, including their application to XML-like languages.

teaching:
  title: Teaching at Université Côte d'Azur
  info:
    - role: Teaching Assistant in functional programming (48h)
