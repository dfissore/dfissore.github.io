    - role: Teaching Assistant in imperative programming (36h)
      time: Spring 2024
    - role: Teaching Assistant in data structures and C programming (30h)
      time: Autumn 2023
    - role: Tutorship in imperative programming, C and Linux (128h)
      time: Spring 2023
    - role: Tutorship for the course Bases de l'informatique (12h)
      time: Autumn 2022

